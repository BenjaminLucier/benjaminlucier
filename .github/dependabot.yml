# Weekly, one grouped PR per ecosystem. A release has to be a week old before it's proposed, so a
# hijacked one is usually caught and pulled first; security updates skip the wait. github-actions
# has nothing to update yet, but keeps any workflow added later pinned and current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm: { patterns: ["*"] }
